name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install ruff
        run: python -m pip install ruff==0.15.13
      - name: Determine lint targets
        id: lint_targets
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            git ls-files | grep -E '^(src|tests)/.*\.py$' > lint_targets.txt || true
          else
            git diff --name-only --diff-filter=ACMR "$base_sha" "${{ github.sha }}" | grep -E '^(src|tests)/.*\.py$' > lint_targets.txt || true
          fi

          count=$(wc -l < lint_targets.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Run ruff
        if: steps.lint_targets.outputs.count != '0'
        run: xargs -a lint_targets.txt python -m ruff check --select E,F,W --ignore E501,E402

      - name: Skip ruff
        if: steps.lint_targets.outputs.count == '0'
        run: echo "No changed Python files under src/ or tests/."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest==9.0.2
      - name: Run full test suite
        # Gate merges on the ENTIRE suite, not a ~6-file subset. Every
        # incident this cycle was a cross-file gate interaction that the
        # subset never exercised; the full suite (1000+ tests, ~4 min)
        # is the regression net that actually catches them.
        run: python -m pytest tests/ -q --tb=short --durations=15

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.0
      - name: Generate dependency audit report
        run: |
          python -m pip_audit \
            --no-deps \
            --require-hashes \
            -r requirements.lock \
            --format json \
            --output dependency-audit.json || true
      - name: Upload dependency audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.sha }}
          path: dependency-audit.json
          if-no-files-found: error

  sbom:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - test
      - dependency-audit
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install CycloneDX generator
        run: python -m pip install cyclonedx-bom==7.3.0
      - name: Generate SBOM
        run: |
          python -m cyclonedx_py requirements requirements.lock \
            --output-reproducible \
            --of JSON \
            -o sbom.cdx.json
          sha256sum requirements.lock sbom.cdx.json > sbom.SHA256SUMS
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: |
            sbom.cdx.json
            sbom.SHA256SUMS
          if-no-files-found: error
