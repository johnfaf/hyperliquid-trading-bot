<!doctype html>
<html lang="en" class="bg-slate-950 text-slate-100">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} - Hyperliquid Bot</title>
  <script>
    // Apply persisted theme BEFORE tailwind paints to avoid a flash.
    (function () {
      try {
        const t = localStorage.getItem('hlbot-theme');
        if (t === 'light') document.documentElement.classList.add('theme-light');
      } catch (e) { /* localStorage may be unavailable */ }
    })();
  </script>
  <link rel="stylesheet" href="/static/dashboard.css" />
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bin-bar { transition: width 0.2s ease; }
    /* Light theme: re-skin the slate palette on the <html> class.
       We deliberately keep accent colours (emerald/rose/amber) consistent
       across themes so risk signals retain their meaning. */
    html.theme-light { background: #f8fafc; color: #0f172a; }
    html.theme-light body { background: #f8fafc; color: #0f172a; }
    html.theme-light .bg-slate-950 { background: #f8fafc !important; }
    html.theme-light .bg-slate-900 { background: #ffffff !important; }
    html.theme-light .bg-slate-900\/80 { background: rgba(255,255,255,0.85) !important; }
    html.theme-light .bg-slate-950\/60 { background: #f1f5f9 !important; }
    html.theme-light .border-slate-800 { border-color: #e2e8f0 !important; }
    html.theme-light .border-slate-700 { border-color: #cbd5e1 !important; }
    html.theme-light .text-slate-100 { color: #0f172a !important; }
    html.theme-light .text-slate-200 { color: #1e293b !important; }
    html.theme-light .text-slate-300 { color: #334155 !important; }
    html.theme-light .text-slate-400 { color: #475569 !important; }
    html.theme-light .text-slate-500 { color: #64748b !important; }
    html.theme-light .text-slate-600 { color: #475569 !important; }
    html.theme-light .hover\:bg-slate-800\/40:hover { background: #f1f5f9 !important; }
    html.theme-light .bg-slate-800 { background: #e2e8f0 !important; }
    html.theme-light .bg-slate-800\/40 { background: #f1f5f9 !important; }
  </style>
</head>
<body class="min-h-screen">
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-6">
      <a href="/" class="font-bold text-emerald-400">HL Bot</a>
      <nav class="flex gap-4 text-sm text-slate-300"
           hx-boost="true" hx-target="#page-main" hx-select="#page-main" hx-swap="outerHTML" hx-push-url="true">
        <a href="/" class="hover:text-white">Overview</a>
        <a href="/positions" class="hover:text-white">Positions</a>
        <a href="/sources" class="hover:text-white">Sources</a>
        <a href="/calibration" class="hover:text-white">Calibration</a>
        <a href="/traders" class="hover:text-white">Traders</a>
        <a href="/audit" class="hover:text-white">Audit</a>
        <a href="/backtest" class="hover:text-white">Backtest</a>
      </nav>
      <div class="flex-1"></div>
      <span id="health-strip" class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400"
            hx-get="/api/health/strip"
            hx-trigger="load, every 30s, wsEvent"
            hx-swap="none"
            data-ws-refresh-on="cycle,kill_switch">health: …</span>
      <span id="ws-status" class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400">ws: connecting</span>
      <button id="theme-toggle" type="button"
              class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400 hover:text-white"
              title="Toggle dark/light">🌓</button>
      <form action="/api/auth/logout" method="post" class="text-xs">
        <button class="text-slate-400 hover:text-white">sign out</button>
      </form>
    </div>
  </header>
  <main id="page-main" class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
  <script>
    (function () {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const status = document.getElementById('ws-status');
      let socket = null;
      let retry = 0;
      let stopped = false;

      function setStatus(label, tone) {
        if (!status) return;
        const classes = {
          live: 'bg-emerald-900/60 text-emerald-300',
          warn: 'bg-amber-900/60 text-amber-300',
          down: 'bg-rose-900/60 text-rose-300',
          idle: 'bg-slate-800 text-slate-400',
        };
        status.textContent = label;
        status.className = 'text-xs px-2 py-0.5 rounded ' + (classes[tone] || classes.idle);
      }

      function scheduleReconnect() {
        if (stopped) return;
        const delayMs = Math.min(30000, 1000 * Math.pow(2, retry));
        retry = Math.min(retry + 1, 5);
        setStatus(`ws: reconnect ${Math.round(delayMs / 1000)}s`, 'warn');
        setTimeout(connect, delayMs);
      }

      function connect() {
        if (stopped) return;
        setStatus('ws: connecting', 'idle');
        try {
          socket = new WebSocket(proto + '://' + location.host + '/ws');
        } catch (e) {
          scheduleReconnect();
          return;
        }
        socket.onopen = () => {
          retry = 0;
          setStatus('ws: live', 'live');
        };
        socket.onclose = (ev) => {
          if (stopped) return;
          if (ev && ev.code === 4401) {
            setStatus('ws: auth required', 'down');
            return;
          }
          scheduleReconnect();
        };
        socket.onerror = () => {
          setStatus('ws: error', 'down');
        };
        socket.onmessage = (ev) => {
          try {
            const data = JSON.parse(ev.data);
            // Trigger HTMX refresh on tagged sections.
            if (data && data.kind) {
              document.querySelectorAll('[data-ws-refresh-on]').forEach((el) => {
                const kinds = (el.getAttribute('data-ws-refresh-on') || '').split(',').map(s => s.trim());
                if (kinds.includes(data.kind)) {
                  htmx.trigger(el, 'wsEvent');
                }
              });
              // Page-level subscribers (sparkline + fills ticker live in
              // their own pages and don't use HTMX swaps).
              window.dispatchEvent(new CustomEvent('ws-event', {detail: data}));
            }
          } catch (e) { /* ignore malformed */ }
        };
      }

      window.addEventListener('beforeunload', () => {
        stopped = true;
        if (socket) socket.close();
      });
      connect();
    })();

    // Give page-local scripts a chance to clean up intervals/listeners before SPA swaps.
    document.body.addEventListener('htmx:beforeSwap', (ev) => {
      if (ev.detail && ev.detail.target && ev.detail.target.id === 'page-main') {
        window.dispatchEvent(new Event('dashboard:before-page-swap'));
      }
    });

    // Theme toggle. Persisted in localStorage; the inline script in
    // <head> applies it before paint so reloads don't flash.
    (function () {
      const btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', () => {
        const isLight = document.documentElement.classList.toggle('theme-light');
        try { localStorage.setItem('hlbot-theme', isLight ? 'light' : 'dark'); } catch (e) {}
      });
    })();

    // Render the /api/health/strip JSON into the header pill.
    document.body.addEventListener('htmx:afterRequest', (ev) => {
      if (ev.detail.requestConfig?.path !== '/api/health/strip') return;
      const el = document.getElementById('health-strip');
      if (!el) return;
      let body;
      try { body = JSON.parse(ev.detail.xhr.responseText); } catch { return; }
      const tones = {
        green: 'bg-emerald-900/60 text-emerald-300',
        amber: 'bg-amber-900/60 text-amber-300',
        rose:  'bg-rose-900/60 text-rose-300',
      };
      const tone = tones[body.tone] || 'bg-slate-800 text-slate-400';
      el.className = 'text-xs px-2 py-0.5 rounded ' + tone;
      el.title = (body.reasons || []).join(' | ') || body.summary || '';
      el.textContent = 'health: ' + (body.label || 'unknown');
    });
  </script>
</body>
</html>
