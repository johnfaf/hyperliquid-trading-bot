<!doctype html>
{% from "partials/desk_macros.html" import icon %}
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} - HL Trading</title>
  <link rel="stylesheet" href="/static/trading_desk.css" />
</head>
<body class="desk-body desk-login">
  <form method="post" action="/api/auth/login" class="desk-login-form">
    <div class="desk-brand"><span>{{ icon("activity", 18) }}</span><b>HL Trading</b></div>
    <h1>Sign in</h1>
    {% if error %}<p class="desk-login-error" role="alert">{{ error }}</p>{% endif %}
    <label for="access-token">Access token</label>
    <input id="access-token" name="token" type="password" autocomplete="current-password" required autofocus />
    <button type="submit">{{ icon("lock", 15) }} Sign in</button>
  </form>
</body>
</html>
